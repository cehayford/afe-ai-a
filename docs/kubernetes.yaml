# House Agent - Kubernetes Deployment Configuration

# ============================================================================
# Namespace
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: houseagent-production

---
# ============================================================================
# ConfigMap (Non-sensitive configuration)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: houseagent-config
  namespace: houseagent-production
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  ALLOWED_ORIGINS: "https://houseagent.com,https://www.houseagent.com"
  DEFAULT_COUNTRY: "GH"
  SUPPORTED_COUNTRIES: "NG,GH,KE,TZ,ZA"

---
# ============================================================================
# Secret (Sensitive data - create separately with kubectl)
# ============================================================================
# kubectl create secret generic houseagent-secrets \
#   --from-literal=DATABASE_URL=postgresql://user:pass@host/db \
#   --from-literal=SECRET_KEY=your-secret-key \
#   --from-literal=REDIS_URL=redis://host:6379 \
#   --from-literal=FLUTTERWAVE_SECRET_KEY=xxx \
#   --from-literal=PAYSTACK_SECRET_KEY=xxx \
#   -n houseagent-production

---
# ============================================================================
# FastAPI Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: houseagent-api
  namespace: houseagent-production
  labels:
    app: houseagent-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: houseagent-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: houseagent-api
        version: v1
    spec:
      containers:
      - name: api
        image: your-registry/houseagent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: houseagent-config
              key: ENVIRONMENT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: houseagent-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: houseagent-secrets
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: houseagent-secrets
              key: SECRET_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
# ============================================================================
# API Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: houseagent-api-service
  namespace: houseagent-production
  labels:
    app: houseagent-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: houseagent-api

---
# ============================================================================
# Horizontal Pod Autoscaler
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: houseagent-api-hpa
  namespace: houseagent-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: houseagent-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30

---
# ============================================================================
# Celery Worker Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: houseagent-celery
  namespace: houseagent-production
  labels:
    app: houseagent-celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: houseagent-celery
  template:
    metadata:
      labels:
        app: houseagent-celery
    spec:
      containers:
      - name: celery
        image: your-registry/houseagent-api:latest
        command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: houseagent-config
        - secretRef:
            name: houseagent-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"

---
# ============================================================================
# Ingress (NGINX Ingress Controller)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: houseagent-ingress
  namespace: houseagent-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - api.houseagent.com
    secretName: houseagent-tls
  rules:
  - host: api.houseagent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: houseagent-api-service
            port:
              number: 80

---
# ============================================================================
# Network Policy (Security)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: houseagent-network-policy
  namespace: houseagent-production
spec:
  podSelector:
    matchLabels:
      app: houseagent-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: TCP
      port: 443  # Allow HTTPS to external services (payment gateways, etc.)
    - protocol: TCP
      port: 80   # Allow HTTP

---
# ============================================================================
# PodDisruptionBudget (High Availability)
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: houseagent-api-pdb
  namespace: houseagent-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: houseagent-api
